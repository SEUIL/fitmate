services:
  mysql:
    image: mysql:8.4
    container_name: fitmate-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: fitmate
      MYSQL_USER: fitmate
      MYSQL_PASSWORD: fitmate
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
