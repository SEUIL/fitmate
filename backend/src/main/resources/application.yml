spring:
  application:
    name: fitmate-backend
  profiles:
    default: local
  datasource:
    url: ${FITMATE_DB_URL:jdbc:mysql://localhost:3307/fitmate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${FITMATE_DB_USERNAME:fitmate}
    password: ${FITMATE_DB_PASSWORD:fitmate}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the P0 schema; enable validation after all write-side entities are implemented.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations:
      - filesystem:../db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: 8080

fitmate:
  inbody-ai:
    provider: ${FITMATE_INBODY_AI_PROVIDER:MOCK}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.6-luna}
      base-url: https://api.openai.com
      timeout-seconds: 30
      direct-connection: ${OPENAI_DIRECT_CONNECTION:false}
  workout-recommendation-ai:
    enabled: ${FITMATE_WORKOUT_RECOMMENDATION_AI_ENABLED:true}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
    base-url: https://api.openai.com
    timeout-seconds: 15
    direct-connection: ${OPENAI_DIRECT_CONNECTION:false}
  media:
    storage-dir: ${FITMATE_MEDIA_STORAGE_DIR:./data/media}
    max-image-bytes: 10485760
  security:
    jwt:
      issuer: fitmate-backend
      secret: ${FITMATE_JWT_SECRET:}
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
